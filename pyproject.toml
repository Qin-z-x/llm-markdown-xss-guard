[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-markdown-xss-guard"
version = "0.1.0"
description = "Detect and sanitize XSS carriers in rendered LLM Markdown output: script/iframe/object tags, on* event handlers, javascript:/vbscript:/data: URLs and raw HTML, with a strict allowlist sanitizer that never touches code blocks. Stdlib-only Python CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "mdxss-guard contributors" }]
keywords = ["xss", "markdown", "llm", "security", "sanitizer", "html", "cli", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
mdxss-guard = "mdxss_guard.cli:main"

[project.urls]
Homepage = "https://github.com/Qin-z-x/llm-markdown-xss-guard"
Repository = "https://github.com/Qin-z-x/llm-markdown-xss-guard"
Issues = "https://github.com/Qin-z-x/llm-markdown-xss-guard/issues"
Changelog = "https://github.com/Qin-z-x/llm-markdown-xss-guard/blob/main/CHANGELOG.md"
Evidence = "https://github.com/Qin-z-x/llm-markdown-xss-guard/blob/main/docs/EVIDENCE.md"
ThreatModel = "https://github.com/Qin-z-x/llm-markdown-xss-guard/blob/main/docs/THREAT_MODEL.md"

[tool.setuptools]
packages = ["mdxss_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
